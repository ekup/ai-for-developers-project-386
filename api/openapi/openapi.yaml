openapi: 3.0.0
info:
  title: Запись на звонок
  version: 0.0.0
tags:
  - name: Типы событий
  - name: Записи
paths:
  /api/bookings:
    post:
      operationId: Bookings_create
      description: Создать запись на слот (гость).
      parameters: []
      responses:
        '201':
          description: Успешное создание записи.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '409':
          description: The request conflicts with the current state of the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '422':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
      tags:
        - Записи
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookingRequest'
  /api/bookings/upcoming:
    get:
      operationId: Bookings_upcoming
      description: Предстоящие встречи всех типов (владелец).
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Booking'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '409':
          description: The request conflicts with the current state of the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '422':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
      tags:
        - Записи
  /api/bookings/window:
    get:
      operationId: Bookings_window
      description: 'Окно записи: первый и последний день, доступные для записи.'
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingWindow'
      tags:
        - Записи
  /api/event-types:
    get:
      operationId: EventTypes_list
      description: Список активных типов событий.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventType'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '409':
          description: The request conflicts with the current state of the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '422':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
      tags:
        - Типы событий
    post:
      operationId: EventTypes_create
      description: Создать тип события (владелец).
      parameters: []
      responses:
        '201':
          description: Успешное создание типа события.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventType'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '409':
          description: The request conflicts with the current state of the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '422':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
      tags:
        - Типы событий
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventTypeRequest'
  /api/event-types/{id}:
    patch:
      operationId: EventTypes_update
      description: Изменить название и описание типа события (владелец).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventType'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '409':
          description: The request conflicts with the current state of the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '422':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
      tags:
        - Типы событий
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEventTypeRequest'
    delete:
      operationId: EventTypes_remove
      description: Мягко удалить тип события (владелец).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '204':
          description: Успешное удаление без тела.
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '409':
          description: The request conflicts with the current state of the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '422':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
      tags:
        - Типы событий
  /api/event-types/{id}/slots:
    get:
      operationId: EventTypes_slots
      description: Свободные слоты типа события на дату.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlotList'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '409':
          description: The request conflicts with the current state of the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '422':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
      tags:
        - Типы событий
components:
  schemas:
    ApiErrorBody:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Человекочитаемое описание ошибки.
      description: Тело ошибки.
    Booking:
      type: object
      required:
        - id
        - eventType
        - startsAt
        - guestName
        - guestEmail
        - comment
      properties:
        id:
          type: integer
          format: int32
        eventType:
          $ref: '#/components/schemas/EventType'
        startsAt:
          type: string
          format: date-time
        guestName:
          type: string
        guestEmail:
          type: string
        comment:
          type: string
      description: Запись гостя на слот.
    BookingWindow:
      type: object
      required:
        - start
        - end
      properties:
        start:
          type: string
          format: date
          description: Первый день окна (YYYY-MM-DD), серверная дата.
        end:
          type: string
          format: date
          description: Последний день окна (YYYY-MM-DD).
      description: 'Окно записи: период, в пределах которого гость может выбрать слот.'
    CreateBookingRequest:
      type: object
      required:
        - eventTypeId
        - startsAt
        - guestName
        - guestEmail
      properties:
        eventTypeId:
          type: integer
          format: int32
        startsAt:
          type: string
          format: date-time
        guestName:
          type: string
        guestEmail:
          type: string
        comment:
          type: string
      description: Данные для создания записи.
    CreateEventTypeRequest:
      type: object
      required:
        - name
        - description
        - durationMinutes
      properties:
        name:
          type: string
        description:
          type: string
        durationMinutes:
          type: integer
          format: int32
      description: Данные для создания типа события.
    EventType:
      type: object
      required:
        - id
        - name
        - description
        - durationMinutes
      properties:
        id:
          type: integer
          format: int32
          description: Системный идентификатор.
        name:
          type: string
          description: Название.
        description:
          type: string
          description: Описание.
        durationMinutes:
          type: integer
          format: int32
          description: Длительность в минутах.
      description: 'Тип события: шаблон встречи, по которому гость выбирает слот.'
    SlotList:
      type: object
      required:
        - date
        - slots
      properties:
        date:
          type: string
          format: date
          description: Дата (YYYY-MM-DD).
        slots:
          type: array
          items:
            type: string
            format: date-time
          description: Начала свободных слотов.
      description: Свободные слоты на дату.
    UpdateEventTypeRequest:
      type: object
      required:
        - name
        - description
      properties:
        name:
          type: string
        description:
          type: string
      description: Данные для правки типа события.
servers:
  - url: http://localhost:8080
    description: Локальный сервер
    variables: {}
