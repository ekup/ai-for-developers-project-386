name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      contains(github.event.comment.body, ' /oc') ||
      startsWith(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, ' /opencode') ||
      startsWith(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # opencode.jsonc ссылается на файл с ключом Render через {file:...}.
      # Отсутствие файла делает конфиг невалидным, поэтому в CI создаём его
      # заранее. Если секрет RENDER_API_KEY не задан, файл будет пустым —
      # конфиг остаётся валидным, а MCP-сервер Render просто не авторизуется.
      - name: Prepare opencode secrets
        run: |
          mkdir -p "$HOME/.config/opencode/secrets"
          printf '%s' "$RENDER_API_KEY" > "$HOME/.config/opencode/secrets/render_api_key"
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }} # имя секрета зависит от провайдера в model
        with:
          model: opencode/deepseek-v4.1-flash